<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Lady Snowblood</title>
<meta name="description" content="Une veuve en kimono blanc, sur une plaine enneigée, sous la lune. Le clan vient pour elle. Elle en emportera quelques-uns.">
<meta name="theme-color" content="#050505">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Snowblood">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icones/icone-192.png" type="image/png">
<link rel="apple-touch-icon" href="icones/icone-180.png">
<link rel="stylesheet" href="styles.css">

<div id="jeu">
  <canvas id="ecran" aria-label="Lady Snowblood : une femme en kimono blanc affronte les ombres d'un clan sur une plaine enneigée"></canvas>
  <div class="manette">
    <div class="croix" id="croix" aria-label="Croix directionnelle">
      <div class="croix-dessin">
        <svg class="anneau" viewBox="0 0 100 100" aria-hidden="true">
          <circle cx="50" cy="50" r="46"/>
          <path data-dir="up" class="chevron" d="M43 14 L50 8 L57 14"/>
          <path data-dir="down" class="chevron" d="M43 86 L50 92 L57 86"/>
          <path data-dir="left" class="chevron" d="M14 43 L8 50 L14 57"/>
          <path data-dir="right" class="chevron" d="M86 43 L92 50 L86 57"/>
        </svg>
        <span class="pommeau"></span>
      </div>
    </div>
    <div class="actions" id="actions">
      <div class="action"><span class="rond" data-k="fort" aria-label="Coup fort (touche C ou V)"><b class="lettre">C</b><svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 16.5 16.5 3.5" stroke-width="3.6"/><path d="M7.5 20.5 20.5 7.5" stroke-width="3.6"/></svg></span><span class="nom">FORT</span></div>
      <div class="action"><span class="rond" data-k="sabre" aria-label="Coupe légère (touche X ou Espace)"><b class="lettre">X</b><svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19 19 5" stroke-width="2"/><path d="M4.5 14.5l5 5" stroke-width="2"/></svg></span><span class="nom">LÉGER</span></div>
      <div class="action action-fureur"><span class="rond" data-k="fureur" aria-label="Fureur (X et C ensemble)"><b class="lettre">怒</b><svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5c1 4 5 5.5 5 11a5 5 0 0 1-10 0c0-2.4 1.2-3.6 2.4-4.6.2 1.8.9 2.7 2 3.1-.6-3.3.1-6.3.6-9.5z" fill="currentColor" stroke-width="0"/></svg></span><span class="nom">FUREUR</span></div>
    </div>
  </div>
  <div class="tourner" role="alert">
    <svg viewBox="0 0 48 48" aria-hidden="true"><rect x="15" y="6" width="18" height="30" rx="3"/><path d="M8 40a18 18 0 0 0 30 4M38 44l1-6-6 1"/></svg>
    <p>Tournez l'appareil</p>
  </div>
</div>

<script type="module" src="jeu.js"></script>
